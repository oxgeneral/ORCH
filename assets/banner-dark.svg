<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffaf00"/>
    </linearGradient>
    <linearGradient id="amber-shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#ffaf00"/>
      <animate attributeName="x1" values="-100%;100%;-100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" result="blur"/>
      <feComposite in="blur" operator="over"/>
    </filter>
    <filter id="glow-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="840" height="220" fill="url(#bg)"/>
  <rect width="840" height="220" fill="url(#grid)"/>
  <rect width="840" height="220" fill="url(#dots)"/>

  <!-- Ambient glow orbs -->
  <ellipse cx="180" cy="100" rx="200" ry="200" fill="#f59e0b" opacity="0.04" filter="url(#glow-amber)">
    <animate attributeName="cx" values="180;220;160;180" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.04;0.07;0.04" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="660" cy="100" rx="180" ry="180" fill="#ffaf00" opacity="0.03" filter="url(#glow-amber)">
    <animate attributeName="cx" values="660;640;680;660" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.03;0.05;0.03" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Diamond logo -->
  <g transform="translate(420, 60)">
    <polygon points="0,-32 32,0 0,32 -32,0" fill="url(#amber-grad)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#fbbf24" opacity="0.3"/>
    <circle cx="0" cy="0" r="24" fill="#ffaf00" opacity="0.15" filter="url(#glow-sm)">
      <animate attributeName="opacity" values="0.15;0.25;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title "ORCH" -->
  <text x="420" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="56" font-weight="800" fill="url(#amber-shimmer)" letter-spacing="12">
    ORCH
  </text>

  <!-- Animated underline -->
  <rect x="350" y="155" width="140" height="1.5" fill="#ffaf00" rx="0.75" opacity="0.5">
    <animate attributeName="width" values="100;180;100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="370;330;370" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top border accent -->
  <rect x="0" y="0" width="840" height="2" fill="url(#amber-shimmer)" opacity="0.6"/>

  <!-- Stats bar -->
  <rect x="0" y="168" width="840" height="52" fill="#050505" opacity="0.8"/>
  <line x1="0" y1="168" x2="840" y2="168" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Stat: tests -->
  <text x="80" y="192" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="18" font-weight="700" fill="#f59e0b">1647</text>
  <text x="80" y="208" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="8" fill="#555" letter-spacing="2">TESTS ✓</text>

  <!-- Separator dot -->
  <circle cx="164" cy="198" r="1.5" fill="#2a2a2a"/>

  <!-- Stat: adapters -->
  <text x="230" y="192" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="18" font-weight="700" fill="#f59e0b">5</text>
  <text x="230" y="208" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="8" fill="#555" letter-spacing="2">ADAPTERS</text>

  <!-- Separator dot -->
  <circle cx="298" cy="198" r="1.5" fill="#2a2a2a"/>

  <!-- Stat: MIT -->
  <text x="360" y="192" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="18" font-weight="700" fill="#4ade80">MIT</text>
  <text x="360" y="208" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="8" fill="#555" letter-spacing="2">LICENSE</text>

  <!-- Separator dot -->
  <circle cx="432" cy="198" r="1.5" fill="#2a2a2a"/>

  <!-- State machine text -->
  <text x="600" y="190" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="10" fill="#555">todo → in_progress → review → done</text>
  <text x="600" y="207" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="8" fill="#333" letter-spacing="1.5">STRICT STATE MACHINE</text>

  <!-- Bottom border -->
  <rect x="0" y="218" width="840" height="2" fill="url(#amber-shimmer)" opacity="0.3"/>
</svg>