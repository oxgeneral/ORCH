<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffaf00"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="icon-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Row 1 -->
  <!-- Card 1: CEO not babysitter -->
  <g filter="url(#card-shadow)">
    <rect x="10" y="10" width="265" height="185" rx="8" fill="url(#card-bg)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Icon: crown -->
    <circle cx="40" cy="42" r="12" fill="#ffaf00" opacity="0.1" filter="url(#icon-glow)"/>
    <polygon points="40,28 48,38 44,36 40,42 36,36 32,38" fill="url(#amber)" opacity="0.9"/>
    <text x="40" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efe9">CEO, Not Babysitter</text>
    <text x="40" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8a8a8a" line-height="1.5">
      <tspan x="40" dy="0">Set goals, not tasks. Your CTO agent</tspan>
      <tspan x="40" dy="15">decomposes strategy into work.</tspan>
      <tspan x="40" dy="15">You approve. That's the workflow.</tspan>
    </text>
  </g>

  <!-- Card 2: Real departments -->
  <g filter="url(#card-shadow)">
    <rect x="290" y="10" width="265" height="185" rx="8" fill="url(#card-bg)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Icon: org chart -->
    <circle cx="320" cy="42" r="12" fill="#ffaf00" opacity="0.1" filter="url(#icon-glow)"/>
    <rect x="314" y="30" width="12" height="8" rx="2" fill="url(#amber)" opacity="0.9"/>
    <line x1="320" y1="38" x2="320" y2="44" stroke="#ffaf00" stroke-width="1"/>
    <line x1="310" y1="44" x2="330" y2="44" stroke="#ffaf00" stroke-width="1"/>
    <rect x="306" y="44" width="8" height="6" rx="1" fill="#ffaf00" opacity="0.5"/>
    <rect x="326" y="44" width="8" height="6" rx="1" fill="#ffaf00" opacity="0.5"/>
    <text x="320" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efe9">Real Departments</text>
    <text x="320" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8a8a8a">
      <tspan x="320" dy="0">Teams with leads, shared task pools.</tspan>
      <tspan x="320" dy="15">CTO, Backend, QA, Reviewer —</tspan>
      <tspan x="320" dy="15">organized like a real org chart.</tspan>
    </text>
  </g>

  <!-- Card 3: Runs while you sleep -->
  <g filter="url(#card-shadow)">
    <rect x="570" y="10" width="265" height="185" rx="8" fill="url(#card-bg)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Icon: moon -->
    <circle cx="600" cy="40" r="12" fill="#ffaf00" opacity="0.1" filter="url(#icon-glow)"/>
    <circle cx="600" cy="40" r="9" fill="none" stroke="url(#amber)" stroke-width="1.5"/>
    <circle cx="604" cy="37" r="7" fill="#161618"/>
<text x="600" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efe9">Runs While You Sleep</text>
    <text x="600" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8a8a8a">
      <tspan x="600" dy="0">Auto-retry, stall detection, backoff.</tspan>
      <tspan x="600" dy="15">Deploy at night, review in the</tspan>
      <tspan x="600" dy="15">morning. Agents don't stop.</tspan>
    </text>
  </g>

  <!-- Row 2 -->
  <!-- Card 4: Main is sacred -->
  <g filter="url(#card-shadow)">
    <rect x="10" y="215" width="265" height="185" rx="8" fill="url(#card-bg)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Icon: shield/lock -->
    <circle cx="40" cy="247" r="12" fill="#ffaf00" opacity="0.1" filter="url(#icon-glow)"/>
    <path d="M40,233 L50,238 L50,248 C50,254 40,258 40,258 C40,258 30,254 30,248 L30,238 Z" fill="none" stroke="url(#amber)" stroke-width="1.5"/>
    <text x="40" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efe9">Main Branch Sacred</text>
    <text x="40" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8a8a8a">
      <tspan x="40" dy="0">Every agent on its own branch.</tspan>
      <tspan x="40" dy="15">Scope overlap detection. Mandatory</tspan>
      <tspan x="40" dy="15">review. Nothing merges without you.</tspan>
    </text>
  </g>

  <!-- Card 5: 30s setup -->
  <g filter="url(#card-shadow)">
    <rect x="290" y="215" width="265" height="185" rx="8" fill="url(#card-bg)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Icon: lightning -->
    <circle cx="320" cy="247" r="12" fill="#ffaf00" opacity="0.1" filter="url(#icon-glow)"/>
    <polygon points="323,233 316,249 322,249 317,261 328,245 322,245 326,233" fill="url(#amber)" opacity="0.9"/>
    <text x="320" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efe9">30 Seconds Setup</text>
    <text x="320" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8a8a8a">
      <tspan x="320" dy="0">One command deploys CTO, backend,</tspan>
      <tspan x="320" dy="15">QA, reviewer. Team created. Goal</tspan>
      <tspan x="320" dy="15">set. Agents ready.</tspan>
    </text>
  </g>

  <!-- Card 6: Free forever -->
  <g filter="url(#card-shadow)">
    <rect x="570" y="215" width="265" height="185" rx="8" fill="url(#card-bg)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- Icon: open source -->
    <circle cx="600" cy="247" r="12" fill="#ffaf00" opacity="0.1" filter="url(#icon-glow)"/>
    <circle cx="600" cy="247" r="8" fill="none" stroke="url(#amber)" stroke-width="1.5"/>
    <line x1="600" y1="239" x2="600" y2="255" stroke="url(#amber)" stroke-width="1"/>
    <line x1="592" y1="247" x2="608" y2="247" stroke="url(#amber)" stroke-width="1"/>
    <text x="600" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efe9">Free. Yours. Forever.</text>
    <text x="600" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8a8a8a">
      <tspan x="600" dy="0">MIT license. Your API keys. Your</tspan>
      <tspan x="600" dy="15">machine. Plain YAML/JSON files.</tspan>
      <tspan x="600" dy="15">Zero cloud dependencies.</tspan>
    </text>
  </g>
</svg>