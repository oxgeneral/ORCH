<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="840" height="160">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f8f6"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="120" y="15" width="600" height="130" rx="10" fill="url(#term-bg)" stroke="#e0e0dc" stroke-width="0.5"/>

    <rect x="120" y="15" width="600" height="32" rx="10" fill="#f0f0ec"/>
    <rect x="120" y="37" width="600" height="10" fill="#f0f0ec"/>
    <circle cx="142" cy="31" r="5" fill="#ff5f57" opacity="0.8"/>
    <circle cx="158" cy="31" r="5" fill="#ffbd2e" opacity="0.8"/>
    <circle cx="174" cy="31" r="5" fill="#28ca42" opacity="0.8"/>
    <text x="420" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#999999">terminal</text>

    <rect x="120" y="47" width="600" height="98" fill="url(#amber-glow)" rx="0"/>

    <text x="145" y="72" font-family="'Courier New', monospace" font-size="13" fill="#999999">$</text>
    <text x="162" y="72" font-family="'Courier New', monospace" font-size="13" fill="#1a1a1a">npm install -g</text>
    <text x="302" y="72" font-family="'Courier New', monospace" font-size="13" fill="#d97706"> @oxgeneral/orch</text>

    <text x="145" y="100" font-family="'Courier New', monospace" font-size="13" fill="#999999">$</text>
    <text x="162" y="100" font-family="'Courier New', monospace" font-size="13" fill="#1a1a1a">cd ~/your-project &amp;&amp;</text>
    <text x="382" y="100" font-family="'Courier New', monospace" font-size="13" fill="#d97706"> orch</text>

    <rect x="418" y="88" width="8" height="16" fill="#d97706" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <text x="145" y="128" font-family="'Courier New', monospace" font-size="10" fill="#16a34a" opacity="0.7">
      ✓ Auto-initializes, opens TUI command center
    </text>
  </g>
</svg>