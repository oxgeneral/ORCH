<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300">
  <defs>
    <linearGradient id="layer-domain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="layer-app" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="layer-infra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="layer-ui" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="840" height="300" fill="#fafaf8"/>

  <g filter="url(#shadow)">
    <rect x="60" y="20" width="720" height="52" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.5"/>
    <rect x="60" y="20" width="720" height="52" rx="6" fill="url(#layer-domain)"/>
    <text x="85" y="50" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#d97706" letter-spacing="1">DOMAIN</text>
    <text x="210" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#666666">Models · State Machine · Transitions · Errors</text>
    <polygon points="770,38 775,46 770,54 765,46" fill="#d97706" opacity="0.4"/>
  </g>

  <line x1="420" y1="72" x2="420" y2="88" stroke="#d97706" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="420,92 416,86 424,86" fill="#d97706" opacity="0.3"/>

  <g filter="url(#shadow)">
    <rect x="60" y="92" width="720" height="52" rx="6" fill="#ffffff" stroke="#d97706" stroke-opacity="0.2" stroke-width="0.5"/>
    <rect x="60" y="92" width="720" height="52" rx="6" fill="url(#layer-app)"/>
    <text x="85" y="122" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#d97706" letter-spacing="1">APPLICATION</text>
    <text x="255" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#666666">Orchestrator · Services · Event Bus</text>
  </g>

  <line x1="420" y1="144" x2="420" y2="160" stroke="#d97706" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="420,164 416,158 424,158" fill="#d97706" opacity="0.3"/>

  <g filter="url(#shadow)">
    <rect x="60" y="164" width="720" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-opacity="0.15" stroke-width="0.5"/>
    <rect x="60" y="164" width="720" height="52" rx="6" fill="url(#layer-infra)"/>
    <text x="85" y="194" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1">INFRASTRUCTURE</text>
    <text x="285" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#666666">Adapters · Storage · Process · Templates · Workspace</text>
  </g>

  <line x1="420" y1="216" x2="420" y2="232" stroke="#d97706" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="420,236 416,230 424,230" fill="#d97706" opacity="0.3"/>

  <g filter="url(#shadow)">
    <rect x="60" y="236" width="350" height="48" rx="6" fill="#ffffff" stroke="#92400e" stroke-opacity="0.12" stroke-width="0.5"/>
    <rect x="60" y="236" width="350" height="48" rx="6" fill="url(#layer-ui)"/>
    <text x="85" y="264" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#92400e" letter-spacing="1">CLI</text>
    <text x="135" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#666666">Commander.js · 15 commands</text>

    <rect x="430" y="236" width="350" height="48" rx="6" fill="#ffffff" stroke="#92400e" stroke-opacity="0.12" stroke-width="0.5"/>
    <rect x="430" y="236" width="350" height="48" rx="6" fill="url(#layer-ui)"/>
    <text x="455" y="264" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#92400e" letter-spacing="1">TUI</text>
    <text x="505" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#666666">Ink + React command center</text>
  </g>

  <text x="30" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#aaaaaa" letter-spacing="2" transform="rotate(-90, 30, 155)">LAYERED DDD</text>
</svg>