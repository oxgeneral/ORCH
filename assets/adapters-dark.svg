    <text x="700" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b6b6b">Google agy</text>
    <rect x="658" y="142" width="84" height="24" rx="2" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="700" y="159" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#5eead4" letter-spacing="1.2">NATIVE</text>
