    <text x="165" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b6b6b">Multi-provider</text>
    <rect x="130" y="142" width="70" height="24" rx="2" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="165" y="159" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#5eead4" letter-spacing="1.2">NATIVE</text>
  </g>
