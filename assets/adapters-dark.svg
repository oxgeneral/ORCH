<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.4" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="840" height="280" fill="url(#bg)"/>
  <rect width="840" height="280" fill="url(#dots)"/>

  <!-- Title -->
  <text x="420" y="40" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" fill="#6b6b6b" letter-spacing="6">
    YOUR TOOLS BECOME YOUR EMPLOYEES
  </text>

  <!-- 8 adapter columns -->
  <g>
    <text x="60" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#f0efe9" letter-spacing="1">Claude</text>
    <text x="60" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b6b6b">Anthropic</text>
    <rect x="25" y="142" width="70" height="24" rx="2" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="60" y="159" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#5eead4" letter-spacing="1.2">NATIVE</text>
  </g>
  <line x1="112" y1="85" x2="112" y2="170" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

