    <rect x="550" y="142" width="70" height="24" rx="2" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="585" y="159" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#5eead4" letter-spacing="1.2">NATIVE</text>
  </g>
  <line x1="637" y1="85" x2="637" y2="170" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

