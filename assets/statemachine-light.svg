<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="840" height="180">
  <defs>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="840" height="180" fill="#fafaf8"/>

  <g filter="url(#shadow)">
    <rect x="40" y="60" width="120" height="40" rx="20" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="100" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#666666">todo</text>
  </g>

  <line x1="160" y1="80" x2="220" y2="80" stroke="#d97706" stroke-opacity="0.5" stroke-width="1"/>
  <polygon points="224,80 218,76 218,84" fill="#d97706" opacity="0.5"/>

  <g filter="url(#shadow)">
    <rect x="225" y="60" width="150" height="40" rx="20" fill="#ffffff" stroke="#d97706" stroke-opacity="0.5" stroke-width="1"/>
    <text x="300" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#d97706">in_progress</text>
    <rect x="225" y="60" width="150" height="40" rx="20" fill="none" stroke="#d97706" stroke-width="0.5">
      <animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="375" y1="80" x2="445" y2="80" stroke="#d97706" stroke-opacity="0.5" stroke-width="1"/>
  <polygon points="449,80 443,76 443,84" fill="#d97706" opacity="0.5"/>

  <g filter="url(#shadow)">
    <rect x="450" y="60" width="120" height="40" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1"/>
    <text x="510" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#2563eb">review</text>
  </g>

  <line x1="570" y1="80" x2="640" y2="80" stroke="#d97706" stroke-opacity="0.5" stroke-width="1"/>
  <polygon points="644,80 638,76 638,84" fill="#d97706" opacity="0.5"/>

  <g filter="url(#shadow)">
    <rect x="645" y="60" width="120" height="40" rx="20" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.5" stroke-width="1"/>
    <text x="705" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#16a34a">done</text>
    <circle cx="705" cy="80" r="22" fill="none" stroke="#16a34a" stroke-opacity="0.1" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.1;0.03;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M 300,100 L 300,140 L 400,140" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/>
  <g filter="url(#shadow)">
    <rect x="400" y="125" width="120" height="34" rx="17" fill="#ffffff" stroke="#d97706" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="460" y="146" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#d97706" opacity="0.7">retrying</text>
  </g>
  <path d="M 400,135 C 360,135 340,115 340,100" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/>

  <path d="M 520,140 L 600,140" fill="none" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/>
  <g filter="url(#shadow)">
    <rect x="600" y="125" width="100" height="34" rx="17" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="650" y="146" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#dc2626" opacity="0.7">failed</text>
  </g>

  <text x="300" y="25" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaaaa" letter-spacing="2">STATE MACHINE — EVERY TRANSITION VALIDATED</text>
</svg>