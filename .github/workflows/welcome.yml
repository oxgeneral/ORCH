name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to **ORCH** — thanks for opening your first issue!

            We appreciate you taking the time to report this. Here are some helpful links:

            - 📖 [Contributing Guide](https://github.com/Thibault1818/ORCH/blob/main/CONTRIBUTING.md) — how to set up, test, and submit changes
            - 🏗️ [Architecture Overview](https://github.com/Thibault1818/ORCH/blob/main/CLAUDE.md) — understand the codebase structure
            - 💬 [GitHub Issues](https://github.com/Thibault1818/ORCH/issues) — ask questions or share ideas

            If you'd like to fix this yourself, PRs are very welcome! We have **1493+ tests** and strict TypeScript — the CI will guide you.

            ⭐ If you find ORCH useful, consider giving us a star — it helps others discover the project!
          pr-message: |
            🎉 Thanks for your first PR to **ORCH**! We're excited to review your contribution.

            Our CI will run automatically:
            - ✅ TypeScript strict mode check (`tsc --noEmit`)
            - ✅ Full test suite (1493+ tests via Vitest)
            - ✅ ESM build verification

            A maintainer will review your changes shortly. In the meantime, check the [Contributing Guide](https://github.com/Thibault1818/ORCH/blob/main/CONTRIBUTING.md) to make sure everything is in order.

            ⭐ If you enjoy working with ORCH, a star on the repo goes a long way!
