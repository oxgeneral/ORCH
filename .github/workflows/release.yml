name: Create GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Resolve release version
        id: release
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "tag=v$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$LOCAL" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$LOCAL"
            exit 1
          fi
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          # Extract section between "## $VERSION" and next "## " or EOF
          BODY=$(awk "/^## ${VERSION//./\\.}/{found=1; next} /^## [0-9]/{if(found) exit} found" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${{ steps.release.outputs.tag }}"
          fi
          # Write to file to avoid quoting issues
          echo "$BODY" > /tmp/release-notes.md
      - name: Create or update GitHub Release
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --notes-file /tmp/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
