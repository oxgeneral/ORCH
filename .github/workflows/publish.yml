name: Publication guard

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify npm publication is disabled
        run: node -e "const p=require('./package.json'); if(p.private!==true) throw new Error('package must remain private')"
      - run: npm test -- test/security/security-regression.test.ts
