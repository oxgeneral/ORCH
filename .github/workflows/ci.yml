name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- test/security/security-regression.test.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify Git-installable package includes workflow distribution
        run: npm pack --dry-run --ignore-scripts 2>&1 | grep -q 'dist/workflow-'
